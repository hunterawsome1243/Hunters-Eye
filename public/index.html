<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunter's Eye</title>
  <meta name="description" content="Live OSINT map: earthquakes, aircraft, satellites and severe weather">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2338bdf8' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2338bdf8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="sidebar-toggle" class="icon-btn" aria-label="Show or hide the side panel" aria-expanded="true" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span>Hunter's Eye</h1>
    <div id="summary" class="summary" role="group" aria-label="Data layers"></div>
    <div id="status" class="status loading" aria-label="Data status"></div>
  </header>

  <main class="layout">
    <div id="banner" class="banner" role="alert"></div>
    <aside id="sidebar" class="sidebar">
      <section class="panel-section">
        <h2>Filters</h2>
        <div id="filters" class="filters"></div>
      </section>
      <section class="panel-section feed-section">
        <h2>Live feed <span id="feed-count" class="muted"></span></h2>
        <ol id="feed" class="feed" aria-live="polite"></ol>
      </section>
    </aside>

    <div id="map" class="map" aria-label="World map"></div>

    <section id="detail" class="detail" hidden aria-live="polite">
      <header class="detail-head">
        <span class="detail-swatch"></span>
        <div>
          <div class="detail-kicker"></div>
          <h3 class="detail-title"></h3>
        </div>
        <button class="icon-btn detail-close" aria-label="Close details">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <dl class="detail-rows"></dl>
      <div class="detail-extra"></div>
    </section>
  </main>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/satellite.js/satellite.min.js"></script>
  <!-- MapLibre and its Leaflet plugin ship as ES modules that import these names. -->
  <script type="importmap">
    { "imports": { "leaflet": "/js/vendor/leaflet.js", "maplibre-gl": "/vendor/maplibre-gl/maplibre-gl.mjs" } }
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
