name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium
      - name: Browser test against offline stand-ins
        run: npm run smoke -- --fake
